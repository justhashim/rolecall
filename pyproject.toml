[project]
name = "rolecall"
version = "0.1.0"
description = "Job-matching agent over a live jobs index: hybrid search on Postgres + pgvector, grounded tool-calling LLM, retrieval evals."
requires-python = ">=3.13"
dependencies = [
    "fastembed>=0.5",
    "httpx>=0.27",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[project.scripts]
rolecall = "rolecall.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
