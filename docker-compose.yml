services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: rolecall
      POSTGRES_PASSWORD: rolecall
      POSTGRES_DB: rolecall
    ports:
      - "5544:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rolecall"]
      interval: 2s
      retries: 30

  # Re-crawls the feed every hour, which is how often Arbeitnow updates it.
  ingest:
    build: .
    profiles: ["worker"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://rolecall:rolecall@db:5432/rolecall
    command: ["sh", "-c", "while true; do rolecall ingest; sleep 3600; done"]

volumes:
  pgdata:
